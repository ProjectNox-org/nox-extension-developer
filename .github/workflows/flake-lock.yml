name: Flake Lock Update

# Mantém o input `nixpkgs` do flake.lock atualizado sem intervenção manual.
# A versão da skill não depende do lock: `version` é derivada de CHANGELOG.md
# mais o shortRev do commit, então cada release já sai com a versão correta.
on:
  schedule:
    # Segunda-feira às 05:00 UTC.
    - cron: "0 5 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Update flake.lock and validate
        run: |
          set -euo pipefail
          nix flake update
          nix flake check --no-build --all-systems
          nix build .#skill .#cli --no-link

      - name: Commit updated flake.lock
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "flake.lock já está atualizado."
            exit 0
          fi

          OLD=$(git show HEAD:flake.lock | jq -r '.nodes.nixpkgs.locked.rev')
          NEW=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(flake): update nixpkgs input" -m "nixpkgs: ${OLD:0:12} -> ${NEW:0:12}"
          git push
