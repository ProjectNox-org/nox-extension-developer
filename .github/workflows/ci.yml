name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -c "import ast, pathlib; [ast.parse(p.read_bytes(), filename=str(p)) for d in ('scripts', 'tests') for p in pathlib.Path(d).glob('*.py')]"
      - name: Run unit, integration, and security tests
        run: python -m unittest discover -s tests -v
      - name: Validate matrix integrity, scenarios, security, and benchmark
        run: |
          python3 scripts/nox.py matrix --validate
          python3 scripts/nox.py scenarios
          python3 scripts/nox.py benchmark
          python3 scripts/nox.py security-audit .
          python3 scripts/nox.py verify-report README.md
          python3 scripts/nox.py verify-report README.en.md
      - name: Verify deterministic packaging allowlist
        run: |
          python3 scripts/package.py /tmp/nox-ci-candidate.zip
          rm -f /tmp/nox-ci-candidate.zip

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build packages and run flake checks
        run: |
          set -euo pipefail
          nix flake check
          nix build .#skill .#cli --no-link

